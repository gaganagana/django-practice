{% extends "base.html" %}

{% block title %}Delete Note - Django Practice{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-danger shadow-sm rounded-3 p-4 bg-white text-center">
            <div class="text-danger mb-3">
                <i class="fa-solid fa-triangle-exclamation fa-3x"></i>
            </div>
            <h3 class="h4 fw-bold text-dark">Confirm Deletion</h3>
            <p class="text-muted">Are you sure you want to permanently delete the note <strong>"{{ note.title }}"</strong>? This action cannot be undone.</p>

            <form method="POST" class="mt-4">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'notes:detail' note.pk %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Yes, Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
